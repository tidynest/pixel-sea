<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>pixel-sea</title>
    <style>
        html, body { height: 100%; margin: 0; }

        /* Shown if the image is missing, still loading, or motion is reduced. */
        body {
            background: linear-gradient(
                #1e2878 0%,
                #7a4896 34%,
                #e89678 62%,
                #1e5c84 62%,
                #0a1c3a 100%
            );
        }

        .sea-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            width: 100%;
            height: 100%;
            object-fit: cover;
            image-rendering: pixelated;
        }

        @media (prefers-reduced-motion: reduce) { .sea-bg { display: none; } }

        main { color: #ffd9bd; font: 16px/1.6 system-ui, sans-serif; padding: 14vh 8vw; }
    </style>
</head>
<body>
  <img class="sea-bg" src="../sea_dusk_retro.png" alt="">
  <main>
      <h1>pixel-sea</h1>
      <p>The background is one &lt;img&gt; tag. No JavaScript, no canvas, no wasm</p>
  </main>
</body>
</html>
